# IYAKKI boot loader menu for the AMD Kria KV260. Written by board-cfg (one board table, one configuration for every board).
# The first level is the normal start and "More options"; the other starts are on the second level. Paths are on the boot volume.
# nine counted starts, like the PC images: a start the running system never confirms (the confirmation is a UEFI variable the system writes
# at run time; whether U-Boot keeps it is still to be shown on a real board) costs one, then the previous entry starts, then the menu waits
timeout 0
tries 9
scan no

entry iyakki
  title IYAKKI
  kind linux
  kernel /Image
  initrd /rootfs.cpio.gz
  cmdline console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20
  default

entry hwcheck
  title Hardware check (keyboard, mouse, touch, display)
  kind linux
  kernel /Image
  initrd /rootfs.cpio.gz
  cmdline console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20 iyakki.hwcheck=1
  more

entry safegraphics
  title Safe graphics (no GPU drivers)
  kind linux
  kernel /Image
  initrd /rootfs.cpio.gz
  cmdline console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20 modprobe.blacklist=vc4,v3d
  more

entry selftest
  title Boot self-test (verbose, powers off)
  kind linux
  kernel /Image
  initrd /rootfs.cpio.gz
  cmdline console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20 iyakki.selftest=1
  more

entry ssh
  title Remote diagnostics (SSH, keys only)
  kind linux
  kernel /Image
  initrd /rootfs.cpio.gz
  cmdline console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20 iyakki.ssh=1
  more

entry web
  title Also in a browser (HTTPS on port 8443)
  kind linux
  kernel /Image
  initrd /rootfs.cpio.gz
  cmdline console=tty0 console=ttyPS1,115200 earlycon clk_ignore_unused panic=20 iyakki.web=1
  more
