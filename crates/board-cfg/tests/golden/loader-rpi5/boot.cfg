# IYAKKI boot loader menu for the Raspberry Pi 5. Written by board-cfg (one board table, one configuration for every board).
# The first level is the normal start and "More options"; the other starts are on the second level. Paths are on the boot volume.
# nine counted starts, like the PC images: a start the running system never confirms (the confirmation is a UEFI variable the system writes
# at run time; whether U-Boot keeps it is still to be shown on a real board) costs one, then the previous entry starts, then the menu waits
timeout 0
tries 9
scan no

entry iyakki
  title IYAKKI
  kind linux
  kernel /kernel8.img
  initrd /initrd-lean
  cmdline console=tty1 console=ttyAMA10,115200 rootwait panic=10 cgroup_enable=memory cgroup_memory=1 iyakki.board=rpi5
  default
  previous full

entry hwcheck
  title Hardware check (keyboard, mouse, touch, display)
  kind linux
  kernel /kernel8.img
  initrd /initrd-lean
  cmdline console=tty1 console=ttyAMA10,115200 rootwait panic=10 cgroup_enable=memory cgroup_memory=1 iyakki.board=rpi5 iyakki.hwcheck=1
  more

entry safegraphics
  title Safe graphics (no GPU drivers)
  kind linux
  kernel /kernel8.img
  initrd /initrd-lean
  cmdline console=tty1 console=ttyAMA10,115200 rootwait panic=10 cgroup_enable=memory cgroup_memory=1 iyakki.board=rpi5 modprobe.blacklist=vc4,v3d
  more

entry selftest
  title Boot self-test (verbose, powers off)
  kind linux
  kernel /kernel8.img
  initrd /initrd-lean
  cmdline console=tty1 console=ttyAMA10,115200 rootwait panic=10 cgroup_enable=memory cgroup_memory=1 iyakki.board=rpi5 iyakki.selftest=1
  more

