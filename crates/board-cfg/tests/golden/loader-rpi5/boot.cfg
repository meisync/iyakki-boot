  kind linux
  kernel /kernel8.img
  initrd /initrd-lean
  cmdline console=tty1 console=ttyAMA10,115200 rootwait panic=10 cgroup_enable=memory cgroup_memory=1 iyakki.board=rpi5 iyakki.root=boot
  more

entry full
  title Full start (slower; if the fast start does not work)
  kind linux
  kernel /kernel8.img
  initrd /initrd
  cmdline console=tty1 console=ttyAMA10,115200 rootwait panic=10 cgroup_enable=memory cgroup_memory=1 iyakki.board=rpi5
  more
  requires /initrd
