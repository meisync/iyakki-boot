[workspace]
resolver = "2"
members = ["crates/*"]
# Plain `cargo test` covers the host-testable crates; the UEFI programs build only for x86_64-unknown-uefi:
#   cargo build --release --target x86_64-unknown-uefi -p boot-uefi -p test-efi
default-members = ["crates/boot-core", "crates/uefi-sys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/meisync/iyakki-boot"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
